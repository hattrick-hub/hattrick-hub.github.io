# =========================================================
# CONFIGURACIÓN GENERAL
# =========================================================
title: "Hattrick Hub"
description: "Guías, herramientas y noticias para dominar Hattrick."
url: "https://hattrick-hub.github.io"
baseurl: ""
lang: es
timezone: America/Bogota
image: /assets/img/hero-home.webp
author: elPatronHT
author_team_url: "https://hattrick.org/goto.ashx?path=/Club/?TeamID=538167"
color: "#4B8A61"

# =========================================================
# MARKDOWN
# =========================================================
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# =========================================================
# PLUGINS
# =========================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-redirect-from

# =========================================================
# FEEDS POR COLECCIÓN (jekyll-feed >= 0.15)
# =========================================================
feed:
  posts_limit: 20
  excerpt_only: true
  collections:
    - blog
    - noticias

# =========================================================
# ENLACES RELATIVOS
# =========================================================
relative_links:
  enabled: true
  collections: true

# =========================================================
# VALIDACIÓN
# =========================================================
strict_front_matter: true

# =========================================================
# EXCLUSIONES
# =========================================================
exclude:
  - .DS_Store
  - .git/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - _site/
  - node_modules/
  - package.json
  - src/
  - vendor/
  - yarn.lock
  - scripts/
  - assets/img/raw/
  - .jekyll-cache/
  - .sass-cache/

# =========================================================
# COLECCIONES
# =========================================================
collections:
  blog:
    output: true
    permalink: /blog/:title/
  manual:
    output: true
    permalink: /manual/:title/
  noticias:
    output: true
    permalink: /noticias/:title/
  herramientas:
    output: true
    permalink: /herramientas/:title/

# =========================================================
# VALORES POR DEFECTO
# =========================================================
defaults:
  # Global: fallback para todo el sitio
  - scope:
      path: ""
    values:
      layout: default
      author: elPatronHT
      lang: es
      image: /assets/img/hero-home.webp
      twitter:
        card: summary_large_image

  # Colecciones: layout + imagen de sección como fallback
  - scope:
      path: ""
      type: blog
    values:
      layout: blog-post
      image: /assets/img/hero-blog.webp

  - scope:
      path: ""
      type: manual
    values:
      layout: manual-post
      image: /assets/img/hero-manual.webp

  - scope:
      path: ""
      type: noticias
    values:
      layout: noticias-post
      image: /assets/img/hero-noticias.webp

  - scope:
      path: ""
      type: herramientas
    values:
      layout: herramientas-post
      image: /assets/img/hero-herramientas.webp
