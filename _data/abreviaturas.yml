- category: Tácticas y Estrategias
  list:
    - name: AIM
      description: Táctica de Ataque por el Centro.
      tags: [tactica, ataque]
    - name: AO
      description: Actitud Todo Ofensivo.
      tags: [estrategia, ofensivo]
      notes: Menos usada que AOA.
    - name: AOA
      description: Actitud de Ataque Total.
      tags: [estrategia, ataque]
      notes: La actitud ofensiva más utilizada.
    - name: AOW
      description: Táctica de Ataque por las Bandas.
      tags: [tactica, bandas]
    - name: CA
      description: Táctica de Contraataques.
      tags: [tactica, defensa]
      notes: De las más usadas en Hattrick.
    - name: LS
      description: Táctica de Tiros Lejanos.
      tags: [tactica, ataque]
    - name: PC
      description: Orden de equipo Jugar Creativamente.
      tags: [orden, creatividad]
    - name: PR
      description: Táctica de Presión.
      tags: [tactica, presion]
    - name: SOAP
      description: Jerga irónica "Enviar Órdenes y Rezar".
      tags: [jerga, humor]
      notes: No es una mecánica real del juego.
    - name: Pullback
      description: Estrategia de cambiar órdenes en vivo para defender ventaja.
      tags: [estrategia, partido]
      notes: Concepto táctico clave, no es abreviatura.

