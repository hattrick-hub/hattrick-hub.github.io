- category: Estados de Ánimo y Moral
  list:
    - name: TS
      description: Espíritu del Equipo (moral colectiva).
      tags: [moral, equipo]
      notes: Métrica fundamental, los moods individuales son irrelevantes hoy.

- category: Órdenes y Jugabilidad
  list:
    - name: MOTS
      description: Orden especial Partido de la Temporada.
      tags: [orden, especial]
      notes: Solo disponible en un partido específico por temporada.
    - name: PIC
      description: Orden de equipo Jugar Tranquilo / Relajado.
      tags: [orden, partido]
    - name: PIN
      description: Orden de equipo Jugar Normal.
      tags: [orden, partido]
    - name: SE
      description: Evento Especial (jugada predefinida en partido).
      tags: [evento, partido]
    - name: WO
      description: Victoria automática por incomparecencia del rival.
      tags: [resultado, partido]
      notes: NO significa rendirse; es Walk Over.

- category: Niveles y Mediciones
  list:
    - name: Et
      description: Nivel de habilidad Extraterrestre (>20).
      tags: [nivel, habilidad]
      notes: Muy usado en chat y foros.
    - name: EXP
      description: Experiencia del jugador.
      tags: [medicion, jugador]
    - name: TA
      description: Herramienta de Análisis de Equipo.
      tags: [herramienta, analisis]
    - name: TSI
      description: Índice Total de Habilidades.
      tags: [medicion, jugador]
      notes: La métrica principal de valor de un jugador.
    - name: WC
      description: Nivel Clase Mundial (~18-19) o Copa del Mundo.
      tags: [nivel, torneo]
      notes: Contexto depende de si se habla de habilidad o competición.

- category: Transferencias y Mercado
  list:
    - name: Step Trading
      description: Estrategia de compraventa escalonada para generar plusvalía.
      tags: [mercado, estrategia]
      notes: Término económico clave, no es abreviatura.
    - name: TC
      description: Herramienta para Comparar Transferencias.
      tags: [transferencia, herramienta]
    - name: TL
      description: Jugador en Lista de Transferencias.
      tags: [transferencia, estado]
    - name: TPA
      description: Ajuste de Precio de Transferencia.
      tags: [transferencia, precio]
    - name: TPE
      description: Evaluación de Precio de Transferencia.
      tags: [transferencia, precio]

- category: Selecciones y Juveniles
  list:
    - name: NC
      description: Entrenador de Selección Nacional.
      tags: [seleccion, entrenador]
    - name: NT
      description: Selección Nacional Absoluta.
      tags: [seleccion, nacional]
    - name: U20
      description: Selección Nacional Sub-20.
      tags: [seleccion, juvenil]
      notes: Antes llamada U21, ahora es U20.
    - name: YA
      description: Academia Juvenil / Cantera.
      tags: [juvenil, academia]
    - name: YP
      description: Promover juvenil al primer equipo (Youth Pull).
      tags: [juvenil, accion]
      notes: NO es selección juvenil; es la acción de subir un canterano.
    - name: YS
      description: Plantel / Equipo Juvenil.
      tags: [juvenil, equipo]

- category: Organizaciones y Funcionarios
  list:
    - name: CHPP
      description: Proveedor Certificado de Productos Hattrick.
      tags: [organizacion, desarrollo]
      notes: Certificación oficial para apps externas autorizadas.
    - name: GM
      description: GameMaster, representante oficial por país.
      tags: [funcionario, administrador]
    - name: LA
      description: Administrador de Idioma (traductor oficial).
      tags: [funcionario, idioma]
    - name: MOD
      description: Moderador de conferencias y foros.
      tags: [funcionario, moderador]

- category: Herramientas y Aplicaciones
  list:
    - name: BTL
      description: Between the Lines, app de análisis táctico avanzado.
      tags: [app, analisis]
      notes: App CHPP activa y vigente.
    - name: HO
      description: Hattrick Organizer, gestor offline imprescindible.
      tags: [app, organizador]
      notes: La herramienta CHPP más importante y actualizada.
    - name: HTF
      description: Hattrick Forever, app/navegador móvil.
      tags: [app, movil]
      notes: App CHPP activa y vigente.
    - name: HTRF
      description: Factor Aleatorio de Hattrick.
      tags: [mecanica, aleatorio]
      notes: Concepto interno del motor, no es herramienta.

- category: General y Comunicación
  list:
    - name: BOT
      description: Equipo sin dueño controlado por el sistema.
      tags: [general, automatico]
    - name: Bug
      description: Error o falla temporal del motor del juego.
      tags: [general, error]
      notes: Término universal en foros y reportes.
    - name: HT
      description: Hattrick (el juego o el staff oficial).
      tags: [general, juego]
      notes: Abreviatura universal del juego.
    - name: RL
      description: Vida Real (fuera del juego).
      tags: [general, realidad]
      notes: También se usa IRL (In Real Life).
    - name: RTFM
      description: Jerga "Lee el Maldito Manual".
      tags: [jerga, humor]
      notes: Respuesta clásica a preguntas básicas en foros.