---
layout: default
---

<div class="progress-bar" aria-hidden="true"></div>

<section class="section" aria-label="Contenido de la guía">
  <div class="container">
    <article class="card-post" aria-labelledby="manual-title" itemscope itemtype="https://schema.org/Article">
      {% include card-image.html item=page loading="eager" %}
      <header class="card-header">
        <h1 class="title is-1" id="manual-title" itemprop="headline">{{ page.title | escape }}</h1>
        {% if page.difficulty %}
          <span class="difficulty {{ page.difficulty | downcase }}"
            aria-label="Dificultad: {{ page.difficulty | escape }}">
            {{ page.difficulty | escape }}
          </span>
        {% endif %}
      </header>

      {% include post-meta.html post=page show_author=true %}

      <div class="content">
        {{ content }}
      </div>

      {% include post-tags.html tags=page.tags %}
    </article>
  </div>
</section>
