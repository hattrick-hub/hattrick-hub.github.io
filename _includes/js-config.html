<div id="js-config" data-base-url="{{ site.url | default: '' | escape }}" hidden>
</div>

<script>
  (function () {
    const config = document.getElementById('js-config');
    if (!config) return;

    const baseUrl = config.dataset.baseUrl;
    let base;

    try {
      base = baseUrl ? new URL(baseUrl) : null;
    } catch (e) {
      base = null;
    }

    // Links externos en contenido markdown
    if (base) {
      document.querySelectorAll('.content a[href^="http"]').forEach(function (link) {
        try {
          const linkUrl = new URL(link.href);
          if (linkUrl.hostname !== base.hostname) {
            link.setAttribute('target', '_blank');
            link.setAttribute('rel', 'noopener noreferrer');
          }
        } catch (err) {
          // Ignora URLs malformadas
        }
      });
    }

    // Lazy loading para imágenes sin atributo
    document.querySelectorAll('.content img:not([loading])').forEach(function (img) {
      img.setAttribute('loading', 'lazy');
    });
  })();
</script>
