{% comment %}
post-tags.html — Lista de tags con icono.
  Parámetros: tags (obligatorio)
{% endcomment %}

{% if include.tags and include.tags.size > 0 %}
  <div class="tags">
    {% include icon.html name="tag" %}
    {% for tag in include.tags %}
      <span class="tag">{{ tag | escape }}</span>
    {% endfor %}
  </div>
{% endif %}
